<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {

	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}

.leaflet-safari .leaflet-tile {

	}

.leaflet-safari .leaflet-tile-container {

	mix-blend-mode: plus-lighter;

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}

	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

.leaflet-fade-anim .leaflet-popup {

	        transition: opacity 0.2s linear;
	}

}

.leaflet-bar {

.leaflet-bar a {

.leaflet-oldie .leaflet-control-zoom,

/* Base styles for the element that has a tooltip */

	pointer-events: none;

	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

<style>
/* Console de veille maritime : thème sombre bleu nuit, dans les deux modes du système */
:root {
  --bg: #0a111d; --panel: #0e1726; --panel-2: #121d2f; --raise: #17243a; --hover: #1a2943;
  --line: #1d2a3e; --line-2: #2a3a54;
  --text: #e5ecf5; --soft: #b9c6d6; --dim: #8394ab; --mute: #5c6c83;
  --accent: #2f7cf6; --accent-2: #5b9bff; --accent-bg: rgba(47,124,246,.16);
  --ok: #22c55e; --ok-bg: rgba(34,197,94,.14);
  --dark: #f04848; --dark-bg: rgba(240,72,72,.15);
  --small: #f59e0b; --fixed: #94a3b8; --na: #64748b;
  --sea: #0a1828; --land: #142131; --coast: #2c3e55;
  --r: 6px;
  --f: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a111d; --panel: #0e1726; --text: #e5ecf5; } }
:root[data-theme="dark"] { --bg: #0a111d; --panel: #0e1726; --text: #e5ecf5; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: "tnum" 1, "cv11" 1; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
a { color: var(--accent-2); }

/* ---------- barre du haut ---------- */
.app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; height: 100dvh; }
.top { display: flex; align-items: center; gap: 20px; padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.logo { display: flex; align-items: center; gap: 10px; flex: none; }
.logo b { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.logo small { color: var(--soft); font-size: 13px; margin-left: 8px; white-space: nowrap; }
.nav { display: flex; gap: 4px; margin-left: 28px; }
.nav button { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: var(--r); color: var(--soft); white-space: nowrap; font-weight: 500; }
.nav button:hover { background: var(--panel-2); color: var(--text); }
.nav button[aria-pressed="true"] { background: var(--raise); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.search { margin-left: auto; position: relative; width: 300px; flex: 0 1 300px; min-width: 140px; }
.search input { width: 100%; height: 34px; padding: 0 12px 0 34px; background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--r); color: var(--text); }
.search input::placeholder { color: var(--mute); }
.search svg { position: absolute; left: 11px; top: 10px; color: var(--dim); }
.pill { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--soft); font-size: 12px; white-space: nowrap; flex: none; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.lang { display: flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; flex: none; }
.lang button { padding: 6px 9px; font-size: 12px; font-weight: 600; color: var(--dim); }
.lang button[aria-pressed="true"] { background: var(--raise); color: var(--text); }

/* ---------- grille principale ---------- */
.main { display: grid; grid-template-columns: 254px minmax(0, 1fr) 432px; min-height: 0; }
.left, .right { background: var(--panel); overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.left { border-right: 1px solid var(--line); }
.right { border-left: 1px solid var(--line); }
.block { border-bottom: 1px solid var(--line); padding: 16px 18px; }
.bh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.bh h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
.bh .link { color: var(--accent-2); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.bh .chev { color: var(--dim); padding: 2px; }
.block[data-collapsed="true"] .bb { display: none; }
.block[data-collapsed="true"] .bh { margin-bottom: 0; }
.block[data-collapsed="true"] .chev svg { transform: rotate(180deg); }

/* couches */
.layer { display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; color: var(--soft); }
.layer input { appearance: none; width: 17px; height: 17px; border: 1.5px solid var(--line-2); border-radius: 4px; display: grid; place-items: center; flex: none; margin: 0; background: var(--bg); cursor: pointer; }
.layer input:checked { background: var(--accent); border-color: var(--accent); }
.layer input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.layer span { flex: 1; }
.layer .c { flex: none; font-size: 11.5px; background: var(--raise); color: var(--soft); padding: 2px 7px; border-radius: 4px; min-width: 32px; text-align: center; }
.layer .sw { flex: none; width: 10px; height: 10px; }

/* filtres */
.f { margin-bottom: 16px; }
.f:last-child { margin-bottom: 0; }
.f label, .f .fl { display: block; color: var(--soft); margin-bottom: 7px; }
.sel { width: 100%; height: 36px; background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--r); padding: 0 10px; color: var(--text); }
.period { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.period .sel { padding: 0 6px; font-size: 12.5px; }
.period svg { color: var(--dim); }
.range { display: grid; grid-template-columns: 1fr 40px; gap: 10px; align-items: center; }
.range output { height: 30px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); font-size: 12.5px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), var(--line-2) var(--p, 50%)); margin: 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #dfe8f5; border: 0; box-shadow: 0 0 0 3px rgba(47,124,246,.35); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #dfe8f5; border: 0; box-shadow: 0 0 0 3px rgba(47,124,246,.35); cursor: pointer; }
.hint { color: var(--mute); font-size: 11.5px; margin-top: 6px; }

/* scènes */
.scene { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; margin: 0 -8px; border-radius: var(--r); cursor: pointer; }
.scene:hover { background: var(--panel-2); }
.scene[aria-current="true"] { background: var(--accent-bg); box-shadow: inset 0 0 0 1px rgba(47,124,246,.45); }
.scene .th { width: 34px; height: 34px; border-radius: 4px; background: #060c15 center/cover no-repeat; border: 1px solid var(--line-2); }
.scene b { display: block; font-weight: 500; font-size: 12.5px; }
.scene small { color: var(--dim); font-size: 11.5px; }
.scene .eye { color: var(--soft); padding: 4px; border-radius: 4px; }
.scene .eye[aria-pressed="false"] { color: var(--mute); }
.scene .eye:hover { background: var(--raise); }

/* ---------- centre : carte + tableau ---------- */
.center { display: grid; grid-template-rows: minmax(0, 1fr) 330px; min-width: 0; min-height: 0; }
.center[data-view="map"] { grid-template-rows: minmax(0, 1fr) 46px; }
.center[data-view="table"] { grid-template-rows: 180px minmax(0, 1fr); }
.mapwrap { position: relative; min-height: 0; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--sea); }
.leaflet-container { background: var(--sea); font: 12px var(--f); }
.leaflet-control-attribution { background: rgba(10,17,29,.75) !important; color: var(--mute) !important; font-size: 10px !important; }
.leaflet-control-attribution a { color: var(--dim) !important; }
.leaflet-bar { border: 1px solid var(--line-2) !important; border-radius: var(--r) !important; overflow: hidden; box-shadow: none !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--text) !important; border-bottom-color: var(--line-2) !important; width: 32px !important; height: 32px !important; line-height: 30px !important; }
.leaflet-bar a:hover { background: var(--raise) !important; }
.leaflet-control-scale-line { background: transparent; border: 1.5px solid #c6d2e1; border-top: 0; color: #c6d2e1; font-size: 11px; }

.mk { background: none; border: 0; }
.mk svg { display: block; overflow: visible; filter: drop-shadow(0 0 2px rgba(0,0,0,.6)); }
.geo { font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: rgba(185,198,214,.55); white-space: nowrap; font-size: 15px; }
.geo.sea { font-style: italic; font-size: 16px; letter-spacing: .5em; color: rgba(130,160,200,.45); }
.city { font-size: 11px; color: #8394ab; white-space: nowrap; }
.city::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #8394ab; margin-right: 5px; vertical-align: 1px; }
.ring-l { font-size: 10px; color: rgba(110,150,200,.6); white-space: nowrap; }
.co { background: none; border: 0; }
.co .box { position: absolute; left: 14px; bottom: 16px; background: rgba(14,23,38,.94); border: 1px solid var(--c); border-radius: 4px; padding: 7px 10px; white-space: nowrap; min-width: 110px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.co .box::after { content: ""; position: absolute; left: -9px; bottom: -11px; width: 1px; height: 22px; background: var(--c); transform: rotate(-40deg); }
.co b { display: block; font-size: 12.5px; font-weight: 600; color: var(--c-t, var(--text)); }
.co span { display: block; font-size: 11.5px; color: var(--soft); }
.leaflet-tooltip.tt { background: rgba(14,23,38,.95); border: 1px solid var(--line-2); border-radius: 4px; color: var(--text); font: 12px var(--f); padding: 6px 9px; box-shadow: none; }
.leaflet-tooltip.tt::before { display: none; }
.leaflet-tooltip.tt small { color: var(--dim); }
.legend { position: absolute; right: 12px; bottom: 30px; z-index: 500; background: rgba(14,23,38,.9); border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 11px; display: grid; grid-template-columns: 14px auto; gap: 5px 8px; align-items: center; font-size: 11.5px; color: var(--soft); }
.legend .fp { width: 14px; height: 10px; border: 1px solid var(--accent-2); background: rgba(47,124,246,.12); }

.tablepane { display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--panel); min-height: 0; min-width: 0; }
.tbar { display: flex; align-items: center; gap: 4px; padding: 0 14px; height: 46px; border-bottom: 1px solid var(--line); flex: none; }
.ttab { height: 46px; padding: 0 12px; color: var(--soft); font-weight: 500; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; white-space: nowrap; }
.ttab[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.tbar .sp { flex: 1; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { display: flex; align-items: center; gap: 6px; padding: 6px 11px; color: var(--soft); font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.tsearch { padding: 10px 14px 6px; flex: none; }
.tsearch .search { margin: 0; width: 360px; max-width: 100%; }
.tsearch input { height: 32px; }
.tscroll { overflow: auto; flex: 1; min-height: 0; padding: 0 14px 10px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.center[data-view="map"] .tsearch, .center[data-view="map"] .tscroll { display: none; }
table { border-collapse: collapse; width: 100%; min-width: 980px; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; color: var(--soft); font-size: 12px; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
th button { color: inherit; font-weight: inherit; }
th button[data-dir]::after { content: " ↓"; color: var(--accent-2); }
th button[data-dir="asc"]::after { content: " ↑"; }
td { padding: 7px 10px; border-bottom: 1px solid rgba(29,42,62,.7); white-space: nowrap; color: var(--soft); }
td.n { color: var(--text); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel-2); }
tbody tr[aria-current="true"] td { background: var(--accent-bg); }
tbody tr[aria-current="true"] td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.num { font-size: 11.5px; color: var(--dim); }
.sc { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--ok-bg); color: #6ee7a0; font-size: 12px; }
.sc.lo { background: rgba(245,158,11,.14); color: #fbbf5a; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.st i { width: 8px; height: 8px; border-radius: 2px; }
.flag { display: inline-flex; align-items: center; gap: 7px; }
.flag svg { border-radius: 1.5px; box-shadow: 0 0 0 1px rgba(255,255,255,.12); flex: none; }
.empty { padding: 26px 4px; color: var(--dim); }

/* ---------- panneau de droite ---------- */
.scn { display: grid; grid-template-columns: 188px 1fr; gap: 16px; }
.scn .ql { width: 188px; height: 154px; border-radius: 4px; border: 1px solid var(--line-2); background: #050a12 center/contain no-repeat; }
.scn h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 600; word-break: break-all; }
.scn .when { font-weight: 600; font-size: 13px; margin-bottom: 10px; }
.kv { display: grid; gap: 8px; }
.kv div span { display: block; color: var(--dim); font-size: 12px; }
.kv div b { font-weight: 500; }
.nav-det { display: flex; align-items: center; gap: 6px; color: var(--soft); font-size: 12.5px; }
.nav-det button { padding: 3px 6px; border-radius: 4px; color: var(--soft); }
.nav-det button:hover { background: var(--raise); color: var(--text); }
.nav-det button:disabled { opacity: .35; cursor: default; }
.det { display: grid; grid-template-columns: 172px 1fr; gap: 16px; }
.chip { width: 172px; height: 206px; border-radius: 4px; border: 1px solid var(--line-2); background: #000; position: relative; overflow: hidden; }
.chip img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; filter: grayscale(1) contrast(1.05); }
.chip .scl { position: absolute; left: 10px; bottom: 10px; font-size: 10.5px; color: #e5ecf5; text-shadow: 0 1px 2px #000; }
.chip .scl i { display: block; height: 4px; border: 1.5px solid #e5ecf5; border-top: 0; margin-top: 2px; }
.chip .gly { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, #0d1a2b, #050a12); }
.chip .gly span { border: 1px solid var(--soft); background: rgba(185,198,214,.18); border-radius: 2px; }
.chip .gly em { position: absolute; left: 8px; right: 8px; bottom: 10px; text-align: center; font-size: 10.5px; color: var(--mute); font-style: normal; line-height: 1.3; }
.det h4 { margin: 0 0 8px; font-size: 16px; font-weight: 700; letter-spacing: .01em; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 500; border: 1px solid; margin-bottom: 12px; }
.badge.ok { color: #7ee2a5; background: var(--ok-bg); border-color: rgba(34,197,94,.45); }
.badge.dark { color: #ff8a8a; background: var(--dark-bg); border-color: rgba(240,72,72,.5); }
.badge.small { color: #fbbf5a; background: rgba(245,158,11,.13); border-color: rgba(245,158,11,.45); }
.badge.fixed, .badge.na { color: var(--soft); background: var(--raise); border-color: var(--line-2); }
.attrs { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 12.5px; }
.attrs dt { color: var(--dim); }
.attrs dd { margin: 0; color: var(--text); }
.note { margin-top: 14px; padding: 10px 12px; border-radius: var(--r); background: var(--panel-2); border: 1px solid var(--line); color: var(--soft); font-size: 12.5px; }
.note strong { color: var(--text); font-weight: 600; }
.caveat { margin-top: 10px; font-size: 11.5px; color: var(--dim); }
.hist { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hist button { display: grid; grid-template-columns: 18px 1.6fr 1fr 1fr 1fr; gap: 8px; width: 100%; padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--soft); }
.hist button:last-child { border-bottom: 0; }
.hist button:hover { background: var(--panel-2); }
.hist button[aria-current="true"] { background: var(--accent-bg); color: var(--text); }
.hist .i { color: var(--ok); font-weight: 600; }

/* ---------- vue Analyses / Méthode ---------- */
.page { display: none; grid-column: 1 / -1; overflow-y: auto; padding: 28px 32px 40px; min-height: 0; }
.app[data-page="analyses"] .page.analyses, .app[data-page="method"] .page.method { display: block; }
.app[data-page="analyses"] .main > :not(.page), .app[data-page="method"] .main > :not(.page) { display: none; }
.page h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
.page .lead { color: var(--soft); margin: 0 0 22px; max-width: 760px; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.card span { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 7px; }
.card b { display: block; font-size: 26px; font-weight: 600; margin-top: 6px; letter-spacing: -.02em; }
.panels { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.pnl { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
.pnl h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.pnl p { margin: 0 0 14px; color: var(--dim); font-size: 12.5px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--dim); font: 11px var(--f); }
.lg { display: flex; gap: 16px; font-size: 12px; color: var(--soft); margin-top: 8px; flex-wrap: wrap; }
.lg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.step em { font-style: normal; color: var(--accent-2); font-weight: 600; font-size: 12px; }
.step h3 { margin: 6px 0 6px; font-size: 14px; }
.step p { margin: 0; color: var(--soft); font-size: 12.5px; }
.ptab { width: 100%; min-width: 0; }
.ptab td { color: var(--text); }
.ptab td:first-child { color: var(--dim); }

/* ---------- écrans moyens et petits ---------- */
@media (max-width: 1440px) { .main { grid-template-columns: 236px minmax(0, 1fr) 380px; } .logo small { display: none; } .scn { grid-template-columns: 150px 1fr; } .scn .ql { width: 150px; height: 130px; } .det { grid-template-columns: 148px 1fr; } .chip { width: 148px; height: 180px; } }
@media (max-width: 1180px) { .nav button span.t { display: none; } .pill { display: none; } .main { grid-template-columns: 220px minmax(0, 1fr) 340px; } .cards { grid-template-columns: repeat(3, 1fr); } .steps { grid-template-columns: 1fr 1fr; } }
@media (max-width: 920px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-rows: auto auto; }
  .top { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 10px; }
  .nav { margin-left: 0; order: 3; width: 100%; overflow-x: auto; }
  .nav button span.t { display: inline; }
  .search { order: 4; flex: 1 1 100%; width: auto; margin: 0; }
  .lang { margin-left: auto; }
  .main { display: flex; flex-direction: column; }
  .main > * { min-width: 0; width: 100%; }
  .tablepane, .tscroll { max-width: 100vw; }
  .center { display: flex; flex-direction: column; }
  .mapwrap { height: 56vh; min-height: 320px; }
  .center[data-view] .tsearch, .center[data-view] .tscroll { display: block; }
  .tscroll { max-height: 460px; }
  .tsearch .search { width: 100%; }
  .seg.view { display: none; }
  .right { order: -1; border: 0; overflow: visible; }
  .left { border: 0; border-top: 1px solid var(--line); overflow: visible; }
  .right { order: 1; } .left { order: 2; }
  .center { order: -1; }
  .page { padding: 20px 16px; }
  .cards { grid-template-columns: 1fr 1fr; }
  .panels, .steps { grid-template-columns: 1fr; }
  .legend { display: none; }
}
@media (max-width: 460px) { .scn, .det { grid-template-columns: 1fr; } .scn .ql, .chip { width: 100%; } .chip { height: 260px; } .scn .ql { height: 200px; } .tbar { overflow-x: auto; } }
</style>
</head>
<body>
<div class="app" id="app" data-page="ops">
  <header class="top">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="7" fill="#2f7cf6"/><path d="M8 10.5 17 26l9-15.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M12.5 10.5 17 18.4l4.5-7.9" fill="none" stroke="#bcd6ff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <b>VigieMer</b><small>Maritime Domain Awareness</small>
    </div>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-page="ops" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.2"/><path d="M8 1v2.2M8 12.8V15M1 8h2.2M12.8 8H15"/></svg><span class="t" data-i18n="navOps"></span></button>
      <button type="button" data-page="analyses" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 14h12M4 11V7M8 11V3M12 11V8"/></svg><span class="t" data-i18n="navAna"></span></button>
      <button type="button" data-page="method" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 2h7l3 3v9H3z"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3"/></svg><span class="t" data-i18n="navMet"></span></button>
    </nav>
    <div class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg><input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh"></div>
    <div class="pill" title=""><i></i><span data-i18n="pill"></span></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="lang-fr" aria-pressed="true">FR</button><button type="button" id="lang-en" aria-pressed="false">EN</button></div>
  </header>

  <main class="main">
    <aside class="left">
      <section class="block" id="b-layers">
        <div class="bh"><h3 data-i18n="layers"></h3><button type="button" class="chev" data-collapse="b-layers" aria-label="Toggle"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m2.5 7.5 3.5-3.5 3.5 3.5"/></svg></button></div>
        <div class="bb" id="layers"></div>
      </section>
      <section class="block" id="b-filters">
        <div class="bh"><h3 data-i18n="filters"></h3><button type="button" class="link" id="reset" data-i18n="reset"></button></div>
        <div class="bb">
          <div class="f"><span class="fl" data-i18n="period"></span>
            <div class="period"><select class="sel" id="from" aria-label="From"></select><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 8h11M9.5 4.5 13 8l-3.5 3.5"/></svg><select class="sel" id="to" aria-label="To"></select></div></div>
          <div class="f"><label for="ftype" data-i18n="vtype"></label><select class="sel" id="ftype"></select></div>
          <div class="f"><label for="fscore" data-i18n="minScore"></label><div class="range"><input type="range" id="fscore" min="0.90" max="1" step="0.01"><output id="oscore"></output></div></div>
          <div class="f"><label for="flen" data-i18n="minLen"></label><div class="range"><input type="range" id="flen" min="0" max="150" step="5"><output id="olen"></output></div></div>
          <div class="f"><label for="frad" data-i18n="radius"></label><div class="range"><input type="range" id="frad" min="0.5" max="3" step="0.5"><output id="orad"></output></div><div class="hint" data-i18n="radiusHint"></div></div>
        </div>
      </section>
      <section class="block" id="b-scenes">
        <div class="bh"><h3 data-i18n="scenes"></h3><button type="button" class="chev" data-collapse="b-scenes" aria-label="Toggle"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m2.5 7.5 3.5-3.5 3.5 3.5"/></svg></button></div>
        <div class="bb" id="scenes"></div>
      </section>
    </aside>

    <section class="center" id="center" data-view="split">
      <div class="mapwrap">
        <div id="map" role="region" aria-label="Map"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="tablepane">
        <div class="tbar">
          <button type="button" class="ttab" data-tab="det" aria-pressed="true" id="tab-det"></button>
          <button type="button" class="ttab" data-tab="ais" aria-pressed="false" id="tab-ais"></button>
          <button type="button" class="ttab" data-tab="scn" aria-pressed="false" id="tab-scn"></button>

      col: { n: "#", name: "Name / ID", type: "Type", flag: "Flag", pos: "Position (lat, lon)", len: "Length (m)", spd: "Speed (kn)", score: "AI score", dist: "AIS dist. (km)", npass: "Passes", scene: "Scene", st: "Status" },
      scol: { date: "Date (UTC)", sat: "Satellite", dets: "Detections", ok: "AIS identified", dark: "No AIS ≥ 25 m", fixed: "Fixed objects", ais: "AIS vessels", gfw: "GFW SAR" },
      st: { ok: "AIS match", dark: "No AIS · alert", small: "No AIS · small", fixed: "Fixed object", na: "AIS pending" },
      stShort: { ok: "AIS", dark: "Alert", small: "Small", fixed: "Fixed", na: "Pending" },
      a: { type: "Type", flag: "Flag", len: "Length", wid: "Beam", spd: "Speed", hdg: "Heading", score: "AI score", dist: "AIS distance", nn: "Nearest AIS", npass: "Passes", fish: "Fishing prob.", pos: "Position", port: "Nearest port", time: "Pass" },
      unknown: "Unknown", noName: "Unidentified vessel",
      noteDark: km => `No AIS position within <strong>${km} km</strong> at the time of the radar pass. Vessel of 25 m or more: <strong>check first</strong>.`,
      noteSmall: km => `No AIS position within <strong>${km} km</strong>. Craft under 25 m: many are not required to carry AIS.`,
      noteOk: "The vessel was broadcasting AIS at the time of the radar pass.",
      noteFixed: (n, t) => `Seen at the same spot on <strong>${n} of ${t} passes</strong>: platform, buoy, wreck or long-moored vessel.`,
      noteNa: "Global Fishing Watch has not yet published AIS for this pass.",
      caveat: "Absence of AIS is not proof of illegal activity. VigieMer ranks vessels to check. It does not judge.",
      chipNone: "Radar chip not stored · outline from estimated size",
      noSel: "No detection matches the filters.",
      mapSea: "Atlantic Ocean", legOk: "AIS vessel", legDark: "No AIS ≥ 25 m", legSmall: "No AIS < 25 m", legFixed: "Fixed object", legFp: "SAR scene",
      anaT: "Analytics", anaL: n => `Summary of the ${n} Sentinel-1 passes processed off Lomé, Cotonou and Lagos, with the current filters.`,
      kTot: "Radar echoes at sea", kOk: "Identified by AIS", kDark: "No AIS ≥ 25 m", kFixed: "Fixed objects", kRate: "Share identified",
      c1T: "Detections per pass", c1P: "Vessels seen by radar, by status. The white tick is Global Fishing Watch's independent SAR count for the same pass.",
      c2T: "Length of vessels without AIS", c2P: "Estimated length of detections without AIS, in 25 m bins.",
      gfwLine: "GFW SAR (check)",
      metT: "Method", metL: "How VigieMer turns a free radar image into a list of vessels to check.",
      m1T: "Radar image", m1P: "Sentinel-1 (ESA Copernicus) sees through cloud and at night. Each pass covers about 250 × 170 km at 10 m resolution.",
      m2T: "AI detection", m2P: "An open-source Faster R-CNN detector trained on Sentinel-1 by the Allen Institute for AI runs on 2 Kaggle GPUs and estimates length, beam, speed and heading.",
      m3T: "AIS correlation", m3P: "Each detection is compared with AIS positions published by Global Fishing Watch for the same hour. One AIS vessel explains one detection only; the radius widens with its speed.",
      m4T: "Ranking", m4P: "Echoes seen at the same spot on 3 or more passes are fixed objects. A vessel of 25 m or more with no AIS is ranked for priority inspection.",
      parT: "Parameters of this analysis", pM: "AIS radius", pW: "Time window", pL: "Alert length", pS: "Minimum AI score", pF: "Fixed-object radius", pP: "Passes for fixed object",
      limT: "Limits", lim: "Missing AIS is not proof: transponders fail, coverage has gaps, and state vessels may not broadcast. Radar can return buoys or small platforms, and sizes are estimated from a 10 m image. Global Fishing Watch publishes AIS about 4 days late, so this prototype is not real-time.",
      srcT: "Sources", src: "Sentinel-1 imagery © ESA Copernicus · detector © Allen Institute for AI (Apache-2.0) · AIS and SAR presence © <a href=\"https://globalfishingwatch.org\" target=\"_blank\" rel=\"noopener\">Global Fishing Watch</a> · basemap Natural Earth. Data generated "
    }
  };
  let lang = "fr";
  try { const s = localStorage.getItem("vm3-lang"); if (s === "fr" || s === "en") lang = s; } catch (e) {}
  const t = k => T[lang][k];

  // --- formats ----------------------------------------------------------------------------------------
  const p2 = n => String(n).padStart(2, "0");
  const fDate = iso => iso.slice(0, 10);
  const fTime = iso => `${iso.slice(0, 10)} ${iso.slice(11, 16)}`;
  const fShort = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)} ${iso.slice(11, 16)}`;
  const sat = s => s.id.slice(0, 3);
  const fType = v => v ? String(v).replace(/_/g, " ") : "";
  const nf = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString(lang === "fr" ? "fr-FR" : "en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
  const R_KM = 6371.0088, rad = x => x * Math.PI / 180;
  function dist(a, b) { const dLa = rad(b.lat - a.lat), dLo = rad(b.lon - a.lon); const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R_KM * Math.asin(Math.sqrt(h)); }
  function brg(a, b) { const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat)), x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon)); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; }
  const PORTS = [{ n: "Lomé", lat: 6.135, lon: 1.282 }, { n: "Cotonou", lat: 6.345, lon: 2.428 }, { n: "Lagos", lat: 6.43, lon: 3.37 }];

  // Petits drapeaux dessinés (pavillons les plus fréquents) ; les autres : code seul
  const FLAGS = {
    NGA: '<rect width="18" height="12" fill="#fff"/><rect width="6" height="12" fill="#008751"/><rect x="12" width="6" height="12" fill="#008751"/>',
    BEN: '<rect width="18" height="12" fill="#fcd116"/><rect y="6" width="18" height="6" fill="#e8112d"/><rect width="7" height="12" fill="#008751"/>',
    TGO: '<rect width="18" height="12" fill="#006a4e"/><rect y="2.4" width="18" height="2.4" fill="#ffce00"/><rect y="7.2" width="18" height="2.4" fill="#ffce00"/><rect width="7.2" height="7.2" fill="#d21034"/>',
    GHA: '<rect width="18" height="4" fill="#ce1126"/><rect y="4" width="18" height="4" fill="#fcd116"/><rect y="8" width="18" height="4" fill="#006b3f"/>',
    LBR: '<rect width="18" height="12" fill="#fff"/><g fill="#bf0a30"><rect width="18" height="1.1"/><rect y="2.2" width="18" height="1.1"/><rect y="4.4" width="18" height="1.1"/><rect y="6.6" width="18" height="1.1"/><rect y="8.8" width="18" height="1.1"/><rect y="10.9" width="18" height="1.1"/></g><rect width="6.6" height="5.5" fill="#002868"/><circle cx="3.3" cy="2.75" r="1.3" fill="#fff"/>',
    MHL: '<rect width="18" height="12" fill="#003893"/><path d="M0 12 18 2.5v1.6L0 12z" fill="#dd7500"/><path d="M0 12 18 4.1v1.4z" fill="#fff"/><circle cx="4" cy="3.5" r="1.6" fill="#fff"/>',
    PAN: '<rect width="18" height="12" fill="#fff"/><rect x="9" width="9" height="6" fill="#d21034"/><rect y="6" width="9" height="6" fill="#005293"/><circle cx="4.5" cy="3" r="1.1" fill="#005293"/><circle cx="13.5" cy="9" r="1.1" fill="#d21034"/>',
    MLT: '<rect width="18" height="12" fill="#cf142b"/><rect width="9" height="12" fill="#fff"/><rect x="1.4" y="1.4" width="2" height="2" fill="#999"/>',
    ITA: '<rect width="6" height="12" fill="#009246"/><rect x="6" width="6" height="12" fill="#fff"/><rect x="12" width="6" height="12" fill="#ce2b37"/>',
    GBR: '<rect width="18" height="12" fill="#012169"/><path d="M0 0 18 12M18 0 0 12" stroke="#fff" stroke-width="2.4"/><path d="M0 0 18 12M18 0 0 12" stroke="#c8102e" stroke-width="1"/><path d="M9 0v12M0 6h18" stroke="#fff" stroke-width="3.6"/><path d="M9 0v12M0 6h18" stroke="#c8102e" stroke-width="2"/>',
    SGP: '<rect width="18" height="6" fill="#ee2536"/><rect y="6" width="18" height="6" fill="#fff"/><circle cx="4" cy="3" r="1.8" fill="#fff"/><circle cx="4.7" cy="3" r="1.6" fill="#ee2536"/>',
    EGY: '<rect width="18" height="4" fill="#ce1126"/><rect y="4" width="18" height="4" fill="#fff"/><rect y="8" width="18" height="4" fill="#000"/><circle cx="9" cy="6" r="1" fill="#c09300"/>',
    CYP: '<rect width="18" height="12" fill="#fff"/><path d="M5 5.5 8 4l4.5.5L13 6l-3 1.2H6.5z" fill="#d57800"/>',
    SAU: '<rect width="18" height="12" fill="#006c35"/><rect x="4" y="7.5" width="10" height=".8" fill="#fff"/>'
  };
  const flagHtml = f => !f ? "—" : `<span class="flag">${FLAGS[f] ? `<svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">${FLAGS[f]}</svg>` : ""}${esc(f)}</span>`;

  // --- filtres et statut effectif ----------------------------------------------------------------------
  const DEF = { from: scenes[0].t, to: scenes[scenes.length - 1].t, type: "all", score: Math.max(0.9, P.min_score || 0.9), len: 0, rad: P.match_km };
  const F = { ...DEF };
  const L_ON = { sar: true, dark: true, ais: true, fixed: true, fp: true, rings: true };
  const hidden = new Set();                 // scènes masquées (œil)
  let activeScene = null;                   // scène mise en avant
  let tab = "det", sortKey = "default", sortDir = "desc", tq = "", gq = "";
  let selectedId = null;

  // Le rayon peut être réduit : un navire identifié trop loin de sa position AIS redevient « sans AIS »
  function kOf(d) {
    // Seuls les appariements faits dans le rayon de base sont concernés ; ceux permis par la vitesse du navire restent valides
    if (F.rad < P.match_km && d.k0 === "ok" && d.dist != null && d.dist > F.rad && d.dist <= P.match_km) return d.len >= P.min_alert_len ? "dark" : "small";
    return d.k0;
  }
  function layerOk(k) { return k === "ok" ? L_ON.ais : k === "fixed" ? L_ON.fixed : (k === "dark" || k === "small") ? L_ON.dark : L_ON.dark; }
  function passFilters(d) {
    if (hidden.has(d.scene)) return false;
    if (d.t < F.from || d.t > F.to) return false;
    if (d.score < F.score - 1e-9) return false;
    if (d.len < F.len) return false;
    const k = kOf(d);
    if (F.type === "noais") { if (k !== "dark" && k !== "small") return false; }
    else if (F.type !== "all") { if (k !== "ok" || d.type !== F.type) return false; }
    if (gq) { const s = `${d.tn} ${d.name || ""} ${d.flag || ""} ${fType(d.type)}`.toLowerCase(); if (!s.includes(gq)) return false; }
    return true;
  }
  const filtered = () => DATA.detections.filter(passFilters);
  const visibleOnMap = d => passFilters(d) && layerOk(kOf(d));

  // --- carte ------------------------------------------------------------------------------------------
  const map = L.map("map", { zoomControl: false, attributionControl: true, minZoom: 6, maxZoom: 14, zoomSnap: 0.25 }).setView([6.1, 2.6], 8);
  L.control.zoom({ position: "topright" }).addTo(map);
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution("Natural Earth · ESA Copernicus · Global Fishing Watch");
  L.control.scale({ metric: true, imperial: false, position: "bottomleft" }).addTo(map);

  map.createPane("sarPane"); map.getPane("sarPane").style.zIndex = 350;
  const sarLayer = L.layerGroup().addTo(map);
  // Aperçus radar : les pixels hors fauchée (noirs) deviennent transparents, la mer garde sa texture
  const SAR_PNG = {};
  function prepSar(s) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => {
        try {
          const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
          const g = c.getContext("2d"); g.drawImage(im, 0, 0);
          const px = g.getImageData(0, 0, c.width, c.height), a = px.data;
          for (let i = 0; i < a.length; i += 4) { const v = a[i]; if (v < 8) a[i + 3] = 0; else { a[i] = v * .78; a[i + 1] = v * .86; a[i + 2] = Math.min(255, v * 1.02 + 8); } }
          g.putImageData(px, 0, 0); SAR_PNG[s.id] = c.toDataURL("image/png");
        } catch (e) { SAR_PNG[s.id] = im.src; }
        res();
      };
      im.onerror = () => res();
      im.src = "data:image/jpeg;base64," + s.ql;
    });
  }
  const fpLayer = L.layerGroup().addTo(map);
  L.geoJSON(BASE.land, { style: { color: "#2c3e55", weight: 1, fillColor: "#142131", fillOpacity: 1 }, interactive: false }).addTo(map);
  L.geoJSON(BASE.borders, { style: { color: "#3a4e68", weight: 1, dashArray: "5 5" }, interactive: false }).addTo(map);
  const ringLayer = L.layerGroup().addTo(map);
  const shipLayer = L.layerGroup().addTo(map);
  const geoLayer = L.layerGroup().addTo(map);
  let selLayer = null;

  const COUNTRY_FR = { Nigeria: "Nigeria", Benin: "Bénin", Togo: "Togo", Ghana: "Ghana" };
  function drawGeo() {
    geoLayer.clearLayers();
    BASE.countries.forEach(c => L.marker([c.lat, c.lon], { interactive: false, icon: L.divIcon({ className: "geo", html: esc(lang === "fr" ? COUNTRY_FR[c.name] || c.name : c.name), iconSize: null }) }).addTo(geoLayer));
    BASE.cities.filter(c => c.rank <= 4 || c.cap).forEach(c => L.marker([c.lat, c.lon], { interactive: false, icon: L.divIcon({ className: "city", html: esc(c.name), iconSize: null, iconAnchor: [3, 7] }) }).addTo(geoLayer));
    L.marker([4.55, 2.2], { interactive: false, icon: L.divIcon({ className: "geo sea", html: esc(t("mapSea")), iconSize: null }) }).addTo(geoLayer);
  }
  function drawRings() {
    ringLayer.clearLayers();
    if (!L_ON.rings) return;
    PORTS.forEach(p => [12, 24].forEach(nm => {
      L.circle([p.lat, p.lon], { radius: nm * 1852, color: "#3d6aa8", weight: 1, opacity: .55, dashArray: nm === 12 ? "4 4" : "1 5", fill: false, interactive: false }).addTo(ringLayer);
      L.marker([p.lat - nm * 1852 / 111320, p.lon], { interactive: false, icon: L.divIcon({ className: "ring-l", html: nm + " NM", iconSize: null, iconAnchor: [14, -2] }) }).addTo(ringLayer);
    }));
  }
  function drawScenes() {
    sarLayer.clearLayers(); fpLayer.clearLayers();
    scenes.forEach(s => {
      if (hidden.has(s.id) || s.t < F.from || s.t > F.to) return;
      const on = activeScene === null || activeScene === s.id;
      if (L_ON.sar && s.ql && s.ql_bounds && on && SAR_PNG[s.id]) {
        L.imageOverlay(SAR_PNG[s.id], s.ql_bounds, { pane: "sarPane", opacity: activeScene ? .95 : .5, interactive: false }).addTo(sarLayer);
      }
      if (L_ON.fp && s.footprint) {
        L.geoJSON(s.footprint, { style: { color: activeScene === s.id ? "#5b9bff" : "#3d6aa8", weight: activeScene === s.id ? 1.6 : 1, opacity: on ? .85 : .35, dashArray: activeScene === s.id ? null : "6 5", fill: activeScene === s.id, fillColor: "#2f7cf6", fillOpacity: .06 }, interactive: false }).addTo(fpLayer);
      }
    });
  }

  // Marqueurs : triangle = navire (vert AIS, rouge sans AIS), cercle = objet fixe
  function mkSvg(k, s) {
    const c = COL[k];
    if (k === "fixed") return `<svg width="${s}" height="${s}" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3" fill="${c}" fill-opacity=".35" stroke="${c}" stroke-width="1.2"/></svg>`;
    return `<svg width="${s}" height="${s}" viewBox="0 0 12 12"><path d="M6 1.2 11 10.6H1z" fill="${c}" stroke="rgba(0,0,0,.55)" stroke-width=".8" stroke-linejoin="round"/></svg>`;
  }
  function drawShips() {
    shipLayer.clearLayers();
    const z = map.getZoom(), f = z >= 10 ? 1.25 : z >= 9 ? 1.05 : .85;
    const order = { na: 0, fixed: 1, ok: 2, small: 3, dark: 4 };
    DATA.detections.filter(visibleOnMap).map(d => [d, kOf(d)]).sort((a, b) => order[a[1]] - order[b[1]]).forEach(([d, k]) => {
      const s = Math.round((k === "fixed" ? 9 : k === "dark" ? 13 : 11) * f);
      const m = L.marker([d.lat, d.lon], { icon: L.divIcon({ className: "mk", html: mkSvg(k, s), iconSize: [s, s], iconAnchor: [s / 2, s / 2] }), keyboard: false, riseOnHover: true }).addTo(shipLayer);
      m.on("click", () => select(d.id, false));
      m.bindTooltip(`<b>${esc(d.name || d.tn)}</b><br><small>${nf(d.len)} m · ${esc(t("st")[k])}</small>`, { className: "tt", direction: "top", offset: [0, -6] });
    });
  }
  function drawSelection(d) {
    if (selLayer) { map.removeLayer(selLayer); selLayer = null; }
    if (!d) return;
    const k = kOf(d), c = COL[k];
    const ttl = d.name ? esc(d.name) : (k === "ok" ? d.tn : (lang === "fr" ? "Détection IA" : "AI detection"));
    const sub2 = d.flag || d.type ? `${esc(d.flag || "—")} | ${esc(fType(d.type) || "—")}` : `${lang === "fr" ? "Score" : "Score"} ${d.score.toFixed(2)}`;
    selLayer = L.layerGroup([
      L.circleMarker([d.lat, d.lon], { radius: 12, color: c, weight: 1.6, fill: false, interactive: false }),
      L.marker([d.lat, d.lon], { interactive: false, icon: L.divIcon({ className: "co", html: `<div class="box" style="--c:${c};--c-t:${k === "dark" ? "#ff8a8a" : "#fff"}"><b>${ttl}</b><span>${nf(d.len)} m · ${nf(d.spd, 1)} kn</span><span>${sub2}</span></div>`, iconSize: [0, 0] }) })
    ]).addTo(map);
  }

  // --- liste courante (tableau + navigation ‹ ›) -------------------------------------------------------------
  function currentList() {
    let list = filtered();
    if (tab === "ais") list = list.filter(d => kOf(d) === "ok");
    if (activeScene) list = list.filter(d => d.scene === activeScene);
    if (tq) list = list.filter(d => `${d.tn} ${d.name || ""} ${d.flag || ""} ${fType(d.type)}`.toLowerCase().includes(tq));
    const rank = { dark: 0, small: 1, ok: 2, na: 3, fixed: 4 };
    const val = (d, k) => ({ name: (d.name || "~" + d.tn), type: fType(d.type) || "~", flag: d.flag || "~", len: d.len, spd: d.spd, score: d.score, dist: d.dist == null ? 1e9 : d.dist, npass: d.npass, scene: d.t, st: rank[kOf(d)] })[k];
    if (sortKey === "default") list.sort((a, b) => rank[kOf(a)] - rank[kOf(b)] || b.len - a.len);
    else list.sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey); const r = typeof x === "string" ? x.localeCompare(y) : x - y; return sortDir === "asc" ? r : -r; });
    return list;
  }

  // --- rendu des panneaux ----------------------------------------------------------------------------------
  function renderLayers() {
    const fl = filtered();
    const cnt = { sar: scenes.filter(s => !hidden.has(s.id) && s.ql).length, dark: fl.filter(d => ["dark", "small"].includes(kOf(d))).length, ais: fl.filter(d => kOf(d) === "ok").length, fixed: fl.filter(d => kOf(d) === "fixed").length, fp: scenes.filter(s => !hidden.has(s.id)).length, rings: PORTS.length };
    const row = (k, label, sw) => `<label class="layer"><input type="checkbox" data-layer="${k}" ${L_ON[k] ? "checked" : ""}><span>${label}</span>${sw || ""}<b class="c">${cnt[k]}</b></label>`;
    $("layers").innerHTML = row("sar", t("lSar")) + row("dark", t("lDark")) + row("ais", t("lAis")) + row("fixed", t("lFixed")) + row("fp", t("lFp")) + row("rings", t("lRings"));
    $("layers").querySelectorAll("input").forEach(i => i.addEventListener("change", () => { L_ON[i.dataset.layer] = i.checked; drawScenes(); drawRings(); drawShips(); renderLegend(); }));
  }

  function setRange(id, v, out, fmt) { const el = $(id); el.value = v; const p = (v - el.min) / (el.max - el.min) * 100; el.style.setProperty("--p", p + "%"); $(out).textContent = fmt(v); }
  function renderFilters() {
    const opt = (v, l, sel) => `<option value="${esc(v)}" ${sel ? "selected" : ""}>${esc(l)}</option>`;
    $("from").innerHTML = scenes.map(s => opt(s.t, fShort(s.t), s.t === F.from)).join("");
    $("to").innerHTML = scenes.map(s => opt(s.t, fShort(s.t), s.t === F.to)).join("");
    const types = [...new Set(DATA.detections.filter(d => d.type && d.k0 === "ok").map(d => d.type))].filter(x => !/INSUFFICIENT|INACTIVE/.test(x)).sort();
    $("ftype").innerHTML = opt("all", t("allTypes"), F.type === "all") + opt("noais", t("noAis"), F.type === "noais") + types.map(x => opt(x, fType(x), F.type === x)).join("");
    setRange("fscore", F.score, "oscore", v => Number(v).toFixed(2));
    setRange("flen", F.len, "olen", v => v);
    setRange("frad", F.rad, "orad", v => Number(v).toFixed(1));
  }

  function renderScenes() {
    $("scenes").innerHTML = scenes.map(s => {
      const n = DATA.detections.filter(d => d.scene === s.id).length;
      return `<div class="scene" data-scene="${s.id}" aria-current="${activeScene === s.id}" role="button" tabindex="0">
        <span class="th" style="${s.ql ? `background-image:url(data:image/jpeg;base64,${s.ql})` : ""}"></span>
        <span><b>${sat(s)} ${fTime(s.t)}</b><small>${n} ${t("dets")}</small></span>
        <button type="button" class="eye" data-eye="${s.id}" aria-pressed="${!hidden.has(s.id)}" aria-label="Show / hide">${hidden.has(s.id)
          ? '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><path d="M2.5 13.5 13.5 2.5"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>'}</button></div>`;
    }).join("");
    $("scenes").querySelectorAll(".scene").forEach(el => {
      const go = e => { if (e.target.closest(".eye")) return; activeScene = activeScene === el.dataset.scene ? null : el.dataset.scene; hidden.delete(el.dataset.scene); afterChange(true); };
      el.addEventListener("click", go);
      el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(e); } });
    });
    $("scenes").querySelectorAll(".eye").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.eye; if (hidden.has(id)) hidden.delete(id); else { hidden.add(id); if (activeScene === id) activeScene = null; }
      afterChange(false);
    }));
  }

  function renderLegend() {
    const it = (k, l) => `${mkSvg(k, 12)}<span>${t(l)}</span>`;
    $("legend").innerHTML = it("dark", "legDark") + it("small", "legSmall") + it("ok", "legOk") + it("fixed", "legFixed") + `<span class="fp"></span><span>${t("legFp")}</span>`;
  }

  function renderTabs() {
    const fl = filtered().filter(d => !activeScene || d.scene === activeScene);
    $("tab-det").textContent = t("tDet")(fl.length);
    $("tab-ais").textContent = t("tAis")(fl.filter(d => kOf(d) === "ok").length);
    $("tab-scn").textContent = t("tScn")(scenes.length);
    document.querySelectorAll(".ttab").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  }

  function renderTable() {
    const box = $("tscroll");
    if (tab === "scn") {
      const C = t("scol");
      box.innerHTML = `<table><thead><tr><th>#</th><th>${C.date}</th><th>${C.sat}</th><th>${C.dets}</th><th>${C.ok}</th><th>${C.dark}</th><th>${C.fixed}</th><th>${C.ais}</th><th>${C.gfw}</th></tr></thead><tbody>` +
        scenes.map((s, i) => { const g = DATA.detections.filter(d => d.scene === s.id); const c = k => g.filter(d => kOf(d) === k).length;
          return `<tr data-scene="${s.id}" aria-current="${activeScene === s.id}"><td class="num">${i + 1}</td><td class="n">${fTime(s.t)}</td><td>Sentinel-${s.id.slice(1, 3)}</td><td class="n">${g.length}</td><td>${c("ok")}</td><td style="color:#ff8a8a">${c("dark")}</td><td>${c("fixed")}</td><td>${s.ais_vessels ?? "—"}</td><td>${s.gfw_sar ?? "—"}</td></tr>`; }).join("") + `</tbody></table>`;
      box.querySelectorAll("tr[data-scene]").forEach(r => r.addEventListener("click", () => { activeScene = r.dataset.scene; tab = "det"; afterChange(true); }));
      return;
    }
    const list = currentList();
    if (!list.length) { box.innerHTML = `<p class="empty">${t("noSel")}</p>`; return; }
    const C = t("col");
    const th = k => `<th><button type="button" data-sort="${k}" ${sortKey === k ? `data-dir="${sortDir}"` : ""}>${C[k]}</button></th>`;
    const shown = list.slice(0, 400);
    box.innerHTML = `<table><thead><tr><th>${C.n}</th>${th("name")}${th("type")}${th("flag")}<th>${C.pos}</th>${th("len")}${th("spd")}${th("score")}${th("dist")}${th("npass")}${th("scene")}${th("st")}</tr></thead><tbody>` +
      shown.map((d, i) => { const k = kOf(d);
        return `<tr data-id="${d.id}" aria-current="${d.id === selectedId}"><td class="num">${i + 1}</td><td class="n">${d.name ? esc(d.name) : `<span style="color:var(--dim)">${d.tn}</span>`}</td><td>${d.type ? esc(fType(d.type)) : t("unknown")}</td><td>${flagHtml(d.flag)}</td><td>${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}</td><td class="n">${nf(d.len)}</td><td>${nf(d.spd, 1)}</td><td><span class="sc${d.score < .95 ? " lo" : ""}">${d.score.toFixed(2)}</span></td><td>${k === "ok" && d.dist != null ? nf(d.dist, 2) : "—"}</td><td>${d.npass}</td><td>${fShort(d.t)}</td><td><span class="st"><i style="background:${COL[k]}"></i>${t("stShort")[k]}</span></td></tr>`; }).join("") + `</tbody></table>` +
      (list.length > shown.length ? `<p class="empty">+ ${list.length - shown.length}</p>` : "");
    box.querySelectorAll("tr[data-id]").forEach(r => r.addEventListener("click", () => select(+r.dataset.id, true)));
    box.querySelectorAll("th [data-sort]").forEach(b => b.addEventListener("click", () => {
      if (sortKey === b.dataset.sort) sortDir = sortDir === "desc" ? "asc" : "desc"; else { sortKey = b.dataset.sort; sortDir = ["name", "type", "flag"].includes(sortKey) ? "asc" : "desc"; }
      renderTable(); renderDet();
    }));
  }

  function footprintKm(s) {
    const b = s.ql_bounds; if (!b) return null;
    const w = dist({ lat: (b[0][0] + b[1][0]) / 2, lon: b[0][1] }, { lat: (b[0][0] + b[1][0]) / 2, lon: b[1][1] });
    const h = dist({ lat: b[0][0], lon: b[0][1] }, { lat: b[1][0], lon: b[0][1] });
    return [w, h];
  }
  function renderScene() {
    const d = DATA.detections.find(x => x.id === selectedId);
    const s = sceneById[activeScene || (d ? d.scene : scenes[scenes.length - 1].id)];
    const g = DATA.detections.filter(x => x.scene === s.id);
    const km = footprintKm(s);
    $("scene-card").innerHTML = `<div class="scn"><div class="ql" style="${s.ql ? `background-image:url(data:image/jpeg;base64,${s.ql})` : ""}" role="img" aria-label="Sentinel-1 quicklook"></div>
      <div><h4>${esc(s.id.slice(0, 16))}</h4><div class="when">${s.t.replace("Z", ":00Z")}</div>
      <div class="kv">${km ? `<div><span>${t("cover")}</span><b>${nf(km[0])} × ${nf(km[1])} km</b></div>` : ""}
      <div><span>${t("detAI")}</span><b>${g.length}</b></div>
      <div><span>${t("aisShips")}</span><b>${s.ais_vessels ?? "—"}</b></div>
      <div><span>${t("gfwSar")}</span><b>${s.gfw_sar ?? "—"}</b></div></div></div></div>`;
  }

  function chip(d) {
    if (d.img) return `<div class="chip"><img alt="Sentinel-1 radar chip ${d.tn}" src="data:image/jpeg;base64,${d.img}"><span class="scl">200 m<i style="width:${Math.round(172 * 200 / 764)}px"></i></span></div>`;
    const w = Math.max(6, Math.min(150, d.len / 764 * 172)), h = Math.max(3, w * Math.min(.3, d.wid / Math.max(d.len, 1)));
    return `<div class="chip"><div class="gly"><span style="width:${w}px;height:${h}px;transform:rotate(${(d.hdg || 0) - 90}deg)"></span><em>${t("chipNone")}</em></div></div>`;
  }
  function renderDet() {
    const list = currentList();
    const d = DATA.detections.find(x => x.id === selectedId);
    const i = d ? list.findIndex(x => x.id === d.id) : -1;
    $("pos").textContent = list.length ? `${i >= 0 ? i + 1 : "–"} / ${list.length}` : "0";
    $("prev").disabled = i <= 0; $("next").disabled = i < 0 || i >= list.length - 1;
    if (!d) { $("det-card").innerHTML = `<p class="empty">${t("noSel")}</p>`; $("hist-block").hidden = true; return; }
    const k = kOf(d), A = t("a");
    const port = PORTS.map(p => ({ p, km: dist(p, d) })).sort((a, b) => a.km - b.km)[0];
    let note;
    if (k === "dark") note = t("noteDark")(F.rad); else if (k === "small") note = t("noteSmall")(F.rad);
    else if (k === "ok") note = t("noteOk"); else if (k === "fixed") note = t("noteFixed")(d.npass, scenes.length); else note = t("noteNa");
    const rows = [
      [A.type, d.type ? esc(fType(d.type)) : t("unknown")], [A.flag, flagHtml(d.flag)],
      [A.len, `${nf(d.len)} m`], [A.wid, `${nf(d.wid)} m`], [A.spd, `${nf(d.spd, 1)} kn`], [A.hdg, `${Math.round(d.hdg)}°`],
      [A.score, d.score.toFixed(2)],
      k === "ok" ? [A.dist, `${nf(d.dist, 2)} km`] : [A.nn, d.nn != null ? `${nf(d.nn, 1)} km` : "—"],
      [A.npass, d.npass], [A.fish, `${Math.round(d.fish * 100)} %`],
      [A.port, `${nf(port.km / 1.852, 1)} NM · ${String(Math.round(brg(port.p, d)) % 360).padStart(3, "0")}° ${esc(port.p.n)}`]
    ];
    $("det-card").innerHTML = `<div class="det">${chip(d)}<div>
        <h4>${d.name ? esc(d.name) : d.tn}</h4>
        <span class="badge ${k}">${k === "ok" ? '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.5" fill="#22c55e"/><path d="m3.6 6.1 1.6 1.6 3.2-3.3" fill="none" stroke="#0e1726" stroke-width="1.5"/></svg>' : `<i style="width:8px;height:8px;border-radius:50%;background:${COL[k]}"></i>`}${esc(t("st")[k])}</span>
        <dl class="attrs">${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl></div></div>
      <div class="note">${note}</div><p class="caveat">${t("caveat")}</p>`;

    // Historique : même endroit (à 200 m près) sur les autres passages
    const same = DATA.detections.filter(x => dist(x, d) <= (P.fixed_m || 200) / 1000).sort((a, b) => b.t.localeCompare(a.t));
    $("hist-block").hidden = false;
    $("hist-h").textContent = t("hist")(same.length);
    $("hist").innerHTML = same.length > 1 ? `<div class="hist">${same.map((x, j) => `<button type="button" data-id="${x.id}" aria-current="${x.id === d.id}"><span class="i">${same.length - j}</span><span>${fTime(x.t)}</span><span>${nf(x.spd, 1)} kn</span><span>${nf(x.len)} m</span><span>${lang === "fr" ? "Score" : "Score"} ${x.score.toFixed(2)}</span></button>`).join("")}</div>` : `<p class="empty" style="padding:4px 0">${t("histNone")}</p>`;
    $("hist").querySelectorAll("button").forEach(b => b.addEventListener("click", () => select(+b.dataset.id, true)));
  }

  // --- pages Analyses et Méthode ------------------------------------------------------------------------
  function renderAnalyses() {
    const fl = filtered();
    const c = k => fl.filter(d => kOf(d) === k).length;
    const tot = fl.length, ok = c("ok"), fixed = c("fixed"), dark = c("dark");
    const sw = col => `<i style="width:8px;height:8px;border-radius:2px;background:${col}"></i>`;
    const card = (l, v, col) => `<div class="card"><span>${col ? sw(col) : ""}${l}</span><b>${v}</b></div>`;
    // graphique 1 : barres empilées par passage + repère GFW
    const W = 640, H = 250, ml = 34, mb = 34, mt = 10, cw = (W - ml - 10) / scenes.length;
    const per = scenes.map(s => { const g = fl.filter(d => d.scene === s.id); return { s, ok: g.filter(d => kOf(d) === "ok").length, dark: g.filter(d => ["dark", "small"].includes(kOf(d))).length, fixed: g.filter(d => kOf(d) === "fixed").length }; });
    const mx = Math.max(10, ...per.map(p => Math.max(p.ok + p.dark + p.fixed, p.s.gfw_sar || 0)));
    const nice = Math.ceil(mx / 50) * 50, y = v => mt + (H - mt - mb) * (1 - v / nice);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("c1T"))}">`;
    for (let v = 0; v <= nice; v += nice / 5) svg += `<line x1="${ml}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#1d2a3e"/><text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    per.forEach((p, i) => {
      const x = ml + i * cw + cw * .22, bw = cw * .56; let base = 0;
      [["ok", p.ok], ["dark", p.dark], ["fixed", p.fixed]].forEach(([k, v]) => { if (!v) return; svg += `<rect x="${x}" y="${y(base + v)}" width="${bw}" height="${y(base) - y(base + v)}" fill="${COL[k]}" opacity=".9"><title>${v}</title></rect>`; base += v; });
      if (p.s.gfw_sar != null) svg += `<line x1="${x - 5}" x2="${x + bw + 5}" y1="${y(p.s.gfw_sar)}" y2="${y(p.s.gfw_sar)}" stroke="#fff" stroke-width="2"><title>GFW ${p.s.gfw_sar}</title></line>`;
      svg += `<text x="${x + bw / 2}" y="${H - mb + 16}" text-anchor="middle">${p.s.t.slice(8, 10)}/${p.s.t.slice(5, 7)}</text><text x="${x + bw / 2}" y="${H - mb + 29}" text-anchor="middle">${p.s.t.slice(11, 16)}</text>`;
    });
    svg += `</svg>`;
    // graphique 2 : histogramme des longueurs sans AIS
    const nd = fl.filter(d => ["dark", "small"].includes(kOf(d)));
    const bins = [0, 25, 50, 75, 100, 125, 150, 200, 1000], lab = ["<25", "25–50", "50–75", "75–100", "100–125", "125–150", "150–200", "200+"];
    const hc = lab.map((_, i) => nd.filter(d => d.len >= bins[i] && d.len < bins[i + 1]).length);
    const W2 = 460, H2 = 250, hm = Math.max(5, ...hc), bw2 = (W2 - 20) / lab.length;
    let svg2 = `<svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="${esc(t("c2T"))}">`;
    hc.forEach((v, i) => { const h = (H2 - 60) * v / hm, x = 10 + i * bw2 + 4; svg2 += `<rect x="${x}" y="${H2 - 34 - h}" width="${bw2 - 8}" height="${h}" rx="2" fill="${i === 0 ? COL.small : COL.dark}" opacity=".85"/><text x="${x + (bw2 - 8) / 2}" y="${H2 - 40 - h}" text-anchor="middle" style="fill:#e5ecf5">${v}</text><text x="${x + (bw2 - 8) / 2}" y="${H2 - 16}" text-anchor="middle">${lab[i]}</text>`; });
    svg2 += `</svg>`;
    $("page-analyses").innerHTML = `<h2>${t("anaT")}</h2><p class="lead">${t("anaL")(scenes.filter(s => !hidden.has(s.id) && s.t >= F.from && s.t <= F.to).length)}</p>
      <div class="cards">${card(t("kTot"), nf(tot))}${card(t("kOk"), nf(ok), COL.ok)}${card(t("kDark"), nf(dark), COL.dark)}${card(t("kFixed"), nf(fixed), COL.fixed)}${card(t("kRate"), tot - fixed ? Math.round(ok / (tot - fixed) * 100) + " %" : "—")}</div>
      <div class="panels"><div class="pnl chart"><h3>${t("c1T")}</h3><p>${t("c1P")}</p>${svg}<div class="lg"><span><i style="background:${COL.ok}"></i>${t("legOk")}</span><span><i style="background:${COL.dark}"></i>${lang === "fr" ? "Sans AIS" : "No AIS"}</span><span><i style="background:${COL.fixed}"></i>${t("legFixed")}</span><span><i style="background:#fff;height:2px;vertical-align:3px"></i>${t("gfwLine")}</span></div></div>
      <div class="pnl chart"><h3>${t("c2T")}</h3><p>${t("c2P")}</p>${svg2}</div></div>`;
  }
  function renderMethod() {
    const st = (n, a, b) => `<div class="step"><em>0${n}</em><h3>${t(a)}</h3><p>${t(b)}</p></div>`;
    const pr = (k, v) => `<tr><td>${t(k)}</td><td>${v}</td></tr>`;
    $("page-method").innerHTML = `<h2>${t("metT")}</h2><p class="lead">${t("metL")}</p>
      <div class="steps">${st(1, "m1T", "m1P")}${st(2, "m2T", "m2P")}${st(3, "m3T", "m3P")}${st(4, "m4T", "m4P")}</div>
      <div class="panels"><div class="pnl"><h3>${t("parT")}</h3><table class="ptab"><tbody>${pr("pM", P.match_km + " km")}${pr("pW", "± " + P.window_h + " h")}${pr("pL", "≥ " + P.min_alert_len + " m")}${pr("pS", P.min_score)}${pr("pF", P.fixed_m + " m")}${pr("pP", P.fixed_min_passes)}</tbody></table></div>
      <div class="pnl"><h3>${t("limT")}</h3><p style="color:var(--soft);font-size:13px">${t("lim")}</p><h3>${t("srcT")}</h3><p style="color:var(--soft);font-size:13px">${t("src")}${DATA.generated.slice(0, 10)}.</p></div></div>`;
  }

  // --- sélection et mise à jour globale ------------------------------------------------------------------------
  function select(id, fly) {
    const d = DATA.detections.find(x => x.id === id); if (!d) return;
    selectedId = id;
    drawSelection(d);
    if (fly) map.flyTo([d.lat, d.lon], Math.max(map.getZoom(), 10), { duration: .7 });
    renderScene(); renderDet();
    document.querySelectorAll("#tscroll tr[data-id]").forEach(r => r.setAttribute("aria-current", +r.dataset.id === id));
    const r = document.querySelector(`#tscroll tr[data-id="${id}"]`); if (r) r.scrollIntoView({ block: "nearest" });
  }
  function afterChange(refit) {
    const cur = DATA.detections.find(x => x.id === selectedId);
    if (!cur || !passFilters(cur) || (activeScene && cur.scene !== activeScene)) {
      const first = currentList()[0]; selectedId = first ? first.id : null;
    }
    renderLayers(); renderScenes(); renderTabs(); renderTable(); renderScene(); renderDet(); renderLegend();
    drawScenes(); drawRings(); drawShips();
    drawSelection(DATA.detections.find(x => x.id === selectedId));
    if (refit) {
      if (activeScene && sceneById[activeScene].ql_bounds) map.flyToBounds(sceneById[activeScene].ql_bounds, { padding: [20, 20], duration: .6 });
      else fitAll();
    }
    if ($("app").dataset.page === "analyses") renderAnalyses();
  }
  function fitAll() {
    const pts = filtered().map(d => [d.lat, d.lon]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(.08), { maxZoom: 10 });
  }
  function applyText() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    $("lang-fr").setAttribute("aria-pressed", lang === "fr"); $("lang-en").setAttribute("aria-pressed", lang === "en");
  }

  // --- interactions ------------------------------------------------------------------------------------
  ["fr", "en"].forEach(l => $("lang-" + l).addEventListener("click", () => { lang = l; try { localStorage.setItem("vm3-lang", l); } catch (e) {} applyText(); renderFilters(); drawGeo(); afterChange(false); renderMethod(); }));
  document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
    $("app").dataset.page = b.dataset.page;
    document.querySelectorAll(".nav button").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (b.dataset.page === "analyses") renderAnalyses();
    if (b.dataset.page === "method") renderMethod();
    if (b.dataset.page === "ops") setTimeout(() => map.invalidateSize(), 50);
  }));
  document.querySelectorAll("[data-collapse]").forEach(b => b.addEventListener("click", () => { const bl = $(b.dataset.collapse); bl.dataset.collapsed = bl.dataset.collapsed === "true" ? "false" : "true"; }));
  document.querySelectorAll(".ttab").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; renderTabs(); renderTable(); renderDet(); }));
  document.querySelectorAll(".seg.view button").forEach(b => b.addEventListener("click", () => {
    $("center").dataset.view = b.dataset.view;
    document.querySelectorAll(".seg.view button").forEach(x => x.setAttribute("aria-pressed", x === b));
    setTimeout(() => map.invalidateSize(), 60);
  }));
  $("from").addEventListener("change", e => { F.from = e.target.value; if (F.to < F.from) F.to = F.from; renderFilters(); afterChange(true); });
  $("to").addEventListener("change", e => { F.to = e.target.value; if (F.from > F.to) F.from = F.to; renderFilters(); afterChange(true); });
  $("ftype").addEventListener("change", e => { F.type = e.target.value; afterChange(false); });
  [["fscore", "score", "oscore", v => Number(v).toFixed(2)], ["flen", "len", "olen", v => v], ["frad", "rad", "orad", v => Number(v).toFixed(1)]].forEach(([id, key, out, fmt]) =>
    $(id).addEventListener("input", e => { F[key] = Number(e.target.value); setRange(id, F[key], out, fmt); afterChange(false); }));
  $("reset").addEventListener("click", () => { Object.assign(F, DEF); hidden.clear(); activeScene = null; gq = ""; $("q").value = ""; renderFilters(); afterChange(true); });
  $("scene-details").addEventListener("click", () => { tab = "scn"; if ($("center").dataset.view === "map") document.querySelector('.seg.view [data-view="split"]').click(); renderTabs(); renderTable(); });
  let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { gq = e.target.value.trim().toLowerCase(); afterChange(false); }, 180); });
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") { const f = currentList()[0]; if (f) select(f.id, true); } });
  let tt; $("tq").addEventListener("input", e => { clearTimeout(tt); tt = setTimeout(() => { tq = e.target.value.trim().toLowerCase(); renderTabs(); renderTable(); renderDet(); }, 180); });
  $("prev").addEventListener("click", () => { const l = currentList(), i = l.findIndex(x => x.id === selectedId); if (i > 0) select(l[i - 1].id, true); });
  $("next").addEventListener("click", () => { const l = currentList(), i = l.findIndex(x => x.id === selectedId); if (i < l.length - 1) select(l[i + 1].id, true); });
  let lastZ = null;
  map.on("zoomend", () => { const z = map.getZoom() >= 10 ? 2 : map.getZoom() >= 9 ? 1 : 0; if (z !== lastZ) { lastZ = z; drawShips(); } });

  // --- démarrage ------------------------------------------------------------------------------------------
  applyText(); renderFilters(); drawGeo();
  // Vue de départ : la scène la plus chargée, et sa plus grande détection sans AIS avec vignette radar
  const busiest = scenes.slice().sort((a, b) => DATA.detections.filter(d => d.scene === b.id).length - DATA.detections.filter(d => d.scene === a.id).length)[0];
  activeScene = busiest ? busiest.id : null;
  const start = DATA.detections.filter(d => d.scene === activeScene && d.k0 === "dark" && d.img).sort((a, b) => b.len - a.len)[0];
  selectedId = start ? start.id : null;
  afterChange(true);
  renderMethod();
  Promise.all(scenes.filter(s => s.ql).map(prepSar)).then(drawScenes);
})();
</script>
</body>
</html>
